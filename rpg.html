<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dice &amp; Dungeons</title>
<style>
:root{--bg:#f1ede4;--panel:#fffdf7;--ink:#2a2418;--mute:#7a6f5a;--line:#d8cfb8;--grass:#b9cf8e;--grass2:#aac47e;--hero:#2f6f8f;--foe:#a8402f;--shop:#c8941f;--good:#3d7a3a;--bad:#a8402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17160f;--panel:#221f15;--ink:#ece4cf;--mute:#a09676;--line:#3a3523;--grass:#3f5a2a;--grass2:#3a5326;--hero:#6bb6d6;--foe:#e0715c;--shop:#e3b341;--good:#8fcf7a;--bad:#e0715c}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,'Times New Roman',serif;display:flex;justify-content:center;padding:14px}
#app{width:100%;max-width:560px;display:grid;gap:10px}
h1{font-size:22px;margin:0;font-weight:700}
.bar{display:flex;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;align-items:center}
.hp{flex:1;min-width:140px}
.hpbox{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:3px}
.hpfill{height:100%;background:var(--good);transition:width .25s}
#grid{display:grid;grid-template-columns:repeat(12,1fr);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.t{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,3.6vw,20px);font-weight:700;background:var(--grass)}
.t:nth-child(even){background:var(--grass2)}
.t.p{color:var(--hero)}.t.e{color:var(--foe)}.t.s{color:var(--shop);background:var(--panel)}
#log{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;height:150px;overflow:auto;font-size:14px}
#log p{margin:2px 0}
.good{color:var(--good)}.bad{color:var(--bad)}.mute{color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
button:hover:not(:disabled){background:var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--hero);outline-offset:2px}
#dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center}
#dpad button{padding:0}
#up{grid-column:2}#left{grid-row:2;grid-column:1}#down{grid-row:2;grid-column:2}#right{grid-row:2;grid-column:3}
#fight{background:var(--panel);border:2px solid var(--foe);border-radius:8px;padding:10px 12px;display:none;gap:8px}
</style>
</head>
<body>
<div id="app">
<h1>Dice &amp; Dungeons</h1>
<div class="bar">
  <div class="hp"><span id="hpTxt"></span><div class="hpbox"><div class="hpfill" id="hpFill"></div></div></div>
  <div>Credits: <b id="cr">0</b></div>
  <div>Potions: <b id="pot">0</b></div>
</div>
<div id="grid" aria-label="Map"></div>
<div id="fight">
  <div><b id="foeName"></b> <span id="foeHp"></span></div>
  <div class="row"><button id="atk">Attack</button><button id="drink">Use potion</button></div>
</div>
<div id="dpad">
  <button id="up" aria-label="Up">▲</button><button id="left" aria-label="Left">◀</button>
  <button id="down" aria-label="Down">▼</button><button id="right" aria-label="Right">▶</button>
</div>
<div class="row"><button id="buy">Buy HP potion (10 credits)</button><button id="use">Use potion</button></div>
<div id="log"></div>
<div class="mute" style="font-size:13px">Move with arrow keys / WASD. Walk onto <b>!</b> to fight, onto <b>$</b> to shop.</div>
</div>
<script>
// ---------- CONFIG ----------
const W = 12, H = 8, POTION_COST = 10, POTION_HEAL = 0.10;
// D6 damage table (rolled only after the attacker wins the D20 contest)
const DAMAGE = { 1: 0, 2: 3, 3: 3, 4: 5, 5: 5, 6: 8 };
const DAMAGE_NAME = { 1: 'Miss', 2: 'Glancing hit', 3: 'Glancing hit', 4: 'Solid hit', 5: 'Solid hit', 6: 'Critical hit' };
const FOES = [
  { name: 'Slime', hp: 15, reward: 5 },
  { name: 'Goblin', hp: 25, reward: 10 },
  { name: 'Orc', hp: 40, reward: 20 },
];

// ---------- STATE ----------
let player, enemies, shop, fight, over;
const d = n => Math.floor(Math.random() * n) + 1;
const $ = id => document.getElementById(id);

function say(msg, cls = '') {
  const p = document.createElement('p');
  p.className = cls; p.textContent = msg;
  $('log').appendChild(p); $('log').scrollTop = 1e9;
}
function randomEmptyTile() {
  let x, y;
  do { x = d(W) - 1; y = d(H) - 1; }
  while ((x === player.x && y === player.y) || (shop && x === shop.x && y === shop.y) || enemies.some(e => e.x === x && e.y === y));
  return { x, y };
}
function spawnEnemy() {
  const f = FOES[Math.floor(Math.random() * FOES.length)];
  enemies.push({ ...f, max: f.hp, ...randomEmptyTile() });
}
function init() {
  player = { x: 0, y: 0, hp: 60, max: 60, credits: 0, potions: 0 };
  enemies = []; fight = null; over = false; shop = null;
  shop = randomEmptyTile();
  for (let i = 0; i < 6; i++) spawnEnemy();
  $('log').innerHTML = '';
  say('You wake in a field. Find enemies (!) to earn credits and the shop ($) to buy potions.', 'mute');
  render();
}

// ---------- RENDER ----------
function render() {
  $('hpTxt').textContent = `HP ${player.hp} / ${player.max}`;
  $('hpFill').style.width = (player.hp / player.max * 100) + '%';
  $('cr').textContent = player.credits;
  $('pot').textContent = player.potions;
  let html = '';
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let c = '', ch = '';
    if (x === player.x && y === player.y) { c = 'p'; ch = '@'; }
    else if (enemies.some(e => e.x === x && e.y === y)) { c = 'e'; ch = '!'; }
    else if (x === shop.x && y === shop.y) { c = 's'; ch = '$'; }
    html += `<div class="t ${c}">${ch}</div>`;
  }
  $('grid').innerHTML = html;
  const onShop = player.x === shop.x && player.y === shop.y;
  $('buy').disabled = !onShop || !!fight || over || player.credits < POTION_COST;
  $('use').disabled = !!fight || over || player.potions < 1 || player.hp >= player.max;
  $('fight').style.display = fight ? 'grid' : 'none';
  if (fight) $('foeHp').textContent = `HP ${Math.max(0, fight.hp)} / ${fight.max}`, $('foeName').textContent = fight.name;
  $('atk').disabled = $('drink').disabled = over;
  $('drink').disabled = over || player.potions < 1 || player.hp >= player.max;
}

// ---------- MOVEMENT ----------
function move(dx, dy) {
  if (fight || over) return;
  const nx = player.x + dx, ny = player.y + dy;
  if (nx < 0 || ny < 0 || nx >= W || ny >= H) return;
  player.x = nx; player.y = ny;
  const foe = enemies.find(e => e.x === nx && e.y === ny);
  if (foe) { fight = foe; say(`A wild ${foe.name} appears!`, 'bad'); }
  else if (nx === shop.x && ny === shop.y) say('You reach the shop.', 'mute');
  render();
}

// ---------- COMBAT (D&D style) ----------
// Attacker and defender both roll a D20. Attacker must roll HIGHER (ties go to the defender).
// On success, attacker rolls a D6 on the damage table.
function attack(attacker, defender, aName, dName) {
  const a = d(20), df = d(20);
  say(`${aName} rolls ${a} vs ${dName} ${df}.`, 'mute');
  if (a <= df) { say(`${dName} defends. Attack cancelled.`); return 0; }
  const r = d(6), dmg = DAMAGE[r];
  say(`${aName} rolls D6: ${r} (${DAMAGE_NAME[r]}${dmg ? ', ' + dmg + ' damage' : ''}).`, dmg ? '' : 'mute');
  return dmg;
}
function playerTurn(action) {
  if (!fight || over) return;
  if (action === 'attack') {
    const dmg = attack(player, fight, 'You', fight.name);
    fight.hp -= dmg;
    if (fight.hp <= 0) return win();
  } else drinkPotion();
  enemyTurn();
}
function enemyTurn() {
  const dmg = attack(fight, player, fight.name, 'You');
  player.hp = Math.max(0, player.hp - dmg);
  if (player.hp <= 0) { over = true; say('You have fallen. Game over.', 'bad'); showRestart(); }
  render();
}
function win() {
  say(`${fight.name} defeated! +${fight.reward} credits.`, 'good');
  player.credits += fight.reward;
  enemies = enemies.filter(e => e !== fight);
  fight = null;
  spawnEnemy();
  render();
}

// ---------- ITEMS ----------
function drinkPotion() {
  if (player.potions < 1 || player.hp >= player.max) return;
  const heal = Math.max(1, Math.round(player.max * POTION_HEAL));
  const before = player.hp;
  player.hp = Math.min(player.max, player.hp + heal);
  player.potions--;
  say(`You drink a potion and heal ${player.hp - before} HP.`, 'good');
  render();
}
function buyPotion() {
  if (player.credits < POTION_COST) return;
  player.credits -= POTION_COST; player.potions++;
  say('Bought an HP potion.', 'good');
  render();
}
function showRestart() {
  const b = document.createElement('button');
  b.textContent = 'Play again'; b.onclick = init;
  $('log').appendChild(b);
}

// ---------- INPUT ----------
$('up').onclick = () => move(0, -1); $('down').onclick = () => move(0, 1);
$('left').onclick = () => move(-1, 0); $('right').onclick = () => move(1, 0);
$('atk').onclick = () => playerTurn('attack');
$('drink').onclick = () => playerTurn('potion');
$('buy').onclick = buyPotion;
$('use').onclick = drinkPotion;
document.addEventListener('keydown', e => {
  const k = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] }[e.key];
  if (k) { e.preventDefault(); move(...k); }
});
init();
</script>
</body>
</html>
